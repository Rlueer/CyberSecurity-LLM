services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cybersecurity
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ../backend/.env
    ports:
      - "3001:3001"
    depends_on:
      - db

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    volumes:
      - ../frontend:/app
      - /app/node_modules
    restart: always
    env_file:
      - ../frontend/.env
    ports:
      - "5173:5173"
    depends_on:
      - backend

  redmine-db:
    image: postgres:15
    container_name: redmine_postgres_db
    environment:
      POSTGRES_DB: redmine_db
      POSTGRES_USER: redmine_user
      POSTGRES_PASSWORD: your_strong_password_here
    volumes:
      - redmine_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  redmine:
    image: redmine:5.1
    container_name: redmine_app
    ports:
      - "8080:3000"
    environment:
      REDMINE_DB_POSTGRES: redmine-db
      REDMINE_DB_DATABASE: redmine_db
      REDMINE_DB_USERNAME: redmine_user
      REDMINE_DB_PASSWORD: your_strong_password_here
    depends_on:
      - redmine-db
    restart: unless-stopped

volumes:
  postgres_data:
    external: true
    name: docker_postgres_data
  redmine_db_data: